      else if (act === 'delete-run') {
        const id = el.getAttribute('data-id');
        state.runs = state.runs.filter((r) => r.id !== id);
        state.selectedRunId = null; saveLocalState(); render(); showToast('러닝 기록이 삭제되었습니다.');
      }
      else if (act === 'share-run-quick' || act === 'share-run-modal') {
        const r = state.runs.find((x) => x.id === el.getAttribute('data-id'));
        state.selectedRunId = null;
        if (r) shareRunToFeed(r, r.title + ' 완료! (' + r.distanceKm + 'km)');
      }
      else if (act === 'weather-geo') { loadWeatherByGeo(); }
      else if (act === 'weather-city') {
        const c = CITY_PRESETS.find((x) => x.id === el.getAttribute('data-city'));
        if (c) { state.weatherCityId = c.id; state.weatherGeoMsg = c.label + ' 지역 기준 실시간 날씨'; fetchWeather(c.lat, c.lng, c.label); }
      }
      else if (act === 'weather-refresh') { if (state.weather) fetchWeather(state.weather.lat, state.weather.lng, state.weather.locationLabel); }
      else if (act === 'map-zoom') {
        const id = el.getAttribute('data-map-id'), delta = parseFloat(el.getAttribute('data-delta'));
        const cur = state.mapZooms[id] || 1;
        state.mapZooms[id] = Math.max(0.6, Math.min(3.5, Number((cur + delta).toFixed(2))));
        render();
      }
      else if (act === 'map-reset') { state.mapZooms[el.getAttribute('data-map-id')] = 1; render(); }
      else if (act === 'live-mode') { if (state.liveStatus !== 'running') { resetLiveRun(); state.liveMode = el.getAttribute('data-mode'); render(); } }
      else if (act === 'sim-speed') { state.simSpeedMult = Number(el.getAttribute('data-mult')); render(); }
      else if (act === 'live-start') { state.liveStatus = 'running'; startLiveLoop(); render(); }
      else if (act === 'live-pause') { stopLiveWatchers(); state.liveStatus = 'paused'; render(); }
      else if (act === 'live-reset') { resetLiveRun(); render(); }
      else if (act === 'live-lap') {
        if (state.liveStatus === 'idle') return;
        const dur = Math.max(1, state.liveElapsedSec - lastLapTime);
        const prevDist = state.liveLaps.reduce((a, l) => a + l.distanceKm, 0);
        const lDist = Math.max(0.1, Number((state.liveDistKm - prevDist).toFixed(2)));
        lastLapTime = state.liveElapsedSec;
        state.liveLaps.push({ km: state.liveLaps.length + 1, distanceKm: lDist, durationSec: dur, paceSecPerKm: Math.round(dur / lDist), elevationDiff: 2 });
        render();
      }
      else if (act === 'live-save') {
        if (state.liveElapsedSec < 5) return;
        const course = COURSE_PRESETS.find((c) => c.id === state.liveCourseId) || COURSE_PRESETS[0];
        const fDist = Math.max(0.1, Number(state.liveDistKm.toFixed(2)));
        const avgP = Math.round(state.liveElapsedSec / fDist);
        const fRoute = state.liveRoute.length >= 2 ? state.liveRoute : course.route.slice(0, 6).map((p) => ({ ...p, paceSecPerKm: avgP }));
          const customLiveShoe = (state.liveShoeCustom || '').trim();
          const newRun = {
          id: 'run-' + Date.now(),
          title: (state.liveTitle || '').trim() || ((state.liveMode === 'gps' ? '실시간 GPS ' : course.name.split(' ')[0] + ' ') + WORKOUT_TYPE_LABELS[state.liveWorkoutType]),
          date: REFERENCE_DATE, startTime: new Date().toTimeString().slice(0, 5), workoutType: state.liveWorkoutType,
          distanceKm: fDist, durationSec: state.liveElapsedSec, avgPaceSecPerKm: avgP,
          elevationGainM: Math.round(fDist * (state.liveMode === 'sim' ? course.elevationGainM / course.distanceKm : 4)),
          calories: Math.round(fDist * 65),
          shoeId: (!customLiveShoe && state.liveShoeId && state.liveShoeId !== '__custom__') ? state.liveShoeId : undefined,
          shoeName: customLiveShoe ? customLiveShoe.slice(0, 120) : undefined,
          courseName: state.liveMode === 'sim' ? course.name : 'GPS 실시간 측정 경로',
          notes: (state.liveMode === 'gps' ? '실시간 GPS' : '코스 시뮬레이션') + '으로 기록됨',
          route: fRoute,
          splits: state.liveLaps.length ? state.liveLaps : [{ km: 1, distanceKm: fDist, durationSec: state.liveElapsedSec, paceSecPerKm: avgP, elevationDiff: 3 }]
        };
        await saveNewRun(newRun);
        resetLiveRun(); state.liveTitle = ''; render();
      }
      else if (act === 'plan-week') { state.planWeekNum = Number(el.getAttribute('data-week')); render(); }
      else if (act === 'toggle-session') {
        const key = el.getAttribute('data-week') + '-' + el.getAttribute('data-day');
        state.plan.completedSessions[key] = !state.plan.completedSessions[key];
        saveLocalState(); render();
      }
      else if (act === 'quick-log-session') {
        state.addRunPreset = { title: el.getAttribute('data-title'), workoutType: el.getAttribute('data-type'), distanceKm: Number(el.getAttribute('data-dist')) };
        state.addRunError = ''; state.showAddRunModal = true; renderModals();
      }
      else if (act === 'period-mode') { state.periodMode = el.getAttribute('data-mode'); state.selectedBucketIdx = null; render(); }
      else if (act === 'select-bucket') { state.selectedBucketIdx = Number(el.getAttribute('data-idx')); render(); }
      else if (act === 'log-filter') { state.logFilterType = el.getAttribute('data-type'); render(); }
      else if (act === 'log-reset') { state.logFilterType = 'all'; state.logSearch = ''; render(); }
      else if (act === 'course-diff') { state.courseDifficulty = el.getAttribute('data-diff'); render(); }
      else if (act === 'preview-course') { state.previewCourseId = el.getAttribute('data-id'); renderModals(); }
      else if (act === 'sim-course') { state.previewCourseId = null; state.liveCourseId = el.getAttribute('data-id'); state.liveMode = 'sim'; state.activeTab = 'live'; render(); }
      else if (act === 'comm-tab') { state.communitySubTab = el.getAttribute('data-sub'); render(); }
      else if (act === 'toggle-cheer') {
        const id = el.getAttribute('data-id');
        state.posts = state.posts.map((p) => p.id === id ? { ...p, cheeredByMe: !p.cheeredByMe, cheersCount: Math.max(0, p.cheersCount + (!p.cheeredByMe ? 1 : -1)) } : p);
        saveLocalState(); render();
      }
      else if (act === 'toggle-comments') { const id = el.getAttribute('data-id'); state.expandedPostId = state.expandedPostId === id ? null : id; render(); }
      else if (act === 'toggle-create-chal') { state.showCreateChallenge = !state.showCreateChallenge; render(); }
      else if (act === 'join-challenge') {
        const id = el.getAttribute('data-id');
        const myId = state.user ? state.user.uid : 'me-local', myName = state.user ? (state.user.displayName || '러너') : '나 (로컬 러너)';
        state.challenges = state.challenges.map((ch) => {
          if (ch.id !== id) return ch;
          const joining = !ch.joinedByMe;
          const myVal = computeChallengeMetric(ch.category, ch.startDate, ch.endDate);
          const rest = (ch.participants || []).filter((p) => p.userId !== myId);
          return {
            ...ch, joinedByMe: joining, myProgress: joining ? myVal : 0,
            participantCount: Math.max(0, ch.participantCount + (joining ? 1 : -1)),
            participants: joining ? [...rest, { userId: myId, displayName: myName, currentValue: myVal }] : rest
          };
        });
        saveLocalState(); render();
      }
      else if (act === 'sync-challenge') {
        const id = el.getAttribute('data-id');
        const myId = state.user ? state.user.uid : 'me-local';
        state.challenges = state.challenges.map((ch) => {
          if (ch.id !== id) return ch;
          const myVal = computeChallengeMetric(ch.category, ch.startDate, ch.endDate);
          return { ...ch, myProgress: myVal, participants: (ch.participants || []).map((p) => p.userId === myId ? { ...p, currentValue: myVal } : p) };
        });
        saveLocalState(); render(); showToast('챌린지 진행 기록이 업데이트되었습니다.');

        if (window.location.protocol === 'file:' || !state.fb) {

          return;

        try {
          await state.fb.authMod.signInWithPopup(state.fb.auth, state.fb.provider);
          showToast('Google 계정으로 클라우드 동기화가 연결되었습니다.');
        } catch (err) { showToast('로그인 창이 닫혔거나 팝업이 차단되었습니다.'); }
      }
      else if (act === 'google-signout') {
        if (state.fb) { await state.fb.authMod.signOut(state.fb.auth); state.user = null; render(); }
      }
      else if (act === 'download-source') {
        try {
          let res = await fetch('/download/index.html', { cache: 'no-store' });
          let html = res.ok ? await res.text() : '';
          if (!html.includes('<!DOCTYPE html>')) {
            res = await fetch(window.location.pathname || '/', { cache: 'no-store' });
            html = await res.text();
          }
          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('GitHub 업로드용 index.html 파일이 다운로드되었습니다.');
        } catch (err) {
          showToast('파일 다운로드 중 오류가 발생했습니다. 코드 복사를 이용해 주세요.');
        }
      }
      else if (act === 'copy-source-code') {
        try {
          let res = await fetch('/download/index.html', { cache: 'no-store' });
          let html = res.ok ? await res.text() : '';
          if (!html.includes('<!DOCTYPE html>')) {
            res = await fetch(window.location.pathname || '/', { cache: 'no-store' });
            html = await res.text();
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(html);
          } else {
            const ta = document.createElement('textarea');
            ta.value = html;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          showToast('index.html 전체 코드가 클립보드에 복사되었습니다.');
        } catch (err) {
          showToast('코드 복사에 실패했습니다.');
        }
      }

      else if (t.id === 'plan-5k') {
        const lbl = document.getElementById('plan-5k-val');
        if (lbl) lbl.textContent = t.value + '분';
      } else if (t.id === 'log-search') { state.logSearch = t.value; render(); const inp = document.getElementById('log-search'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
      else if (t.id === 'calc-dist' || t.id === 'calc-min' || t.id === 'calc-sec') {
        if (t.id === 'calc-dist') state.calcDistKm = t.value;
        if (t.id === 'calc-min') state.calcMin = t.value;
        if (t.id === 'calc-sec') state.calcSec = t.value;
        const d = Math.max(0.5, parseFloat(state.calcDistKm) || 10);
        const s = Math.max(60, (parseInt(state.calcMin || '0', 10) || 0) * 60 + (parseInt(state.calcSec || '0', 10) || 0));
        const pOut = document.getElementById('calc-pace-out'), kOut = document.getElementById('calc-kmh-out'), pr = document.getElementById('calc-preds');
        if (pOut) pOut.textContent = formatPace(Math.round(s / d)) + '/km';
        if (kOut) kOut.textContent = (d / (s / 3600)).toFixed(1) + ' km/h';
        if (pr) pr.innerHTML =
          '<div class="sub-box flex justify-between text-xs"><span class="muted">5K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(d, s, 5)) + '</span></div>' +
          '<div class="sub-box flex justify-between text-xs"><span class="muted">10K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(d, s, 10)) + '</span></div>' +
          '<div class="sub-box flex justify-between text-xs"><span class="muted">하프 21.1K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(d, s, 21.0975)) + '</span></div>' +
          '<div class="sub-box flex justify-between text-xs"><span class="muted">풀코스 42.2K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(d, s, 42.195)) + '</span></div>';
      } else if (t.hasAttribute('data-comment-input')) {
        state.commentDrafts[t.getAttribute('data-comment-input')] = t.value;
      } else if (t.id === 'live-shoe-custom') {
        state.liveShoeCustom = t.value;
        if (t.value.trim()) {
          state.liveShoeId = '__custom__';
          const sel = document.getElementById('live-shoe');
          if (sel) sel.value = '__custom__';
        }
      } else if (t.id === 'ar-shoe-custom') {
        if (t.value.trim()) {
          const sel = document.getElementById('ar-shoe');
          if (sel) sel.value = '__custom__';
        }
      }
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'sim-course-select') { state.liveCourseId = t.value; render(); }
      else if (t.id === 'live-type') { state.liveWorkoutType = t.value; }
      else if (t.id === 'live-shoe') {
        state.liveShoeId = t.value;
        const inp = document.getElementById('live-shoe-custom');
        if (t.value === '__custom__') {
          if (inp) inp.focus();
        } else {
          state.liveShoeCustom = '';
          if (inp) inp.value = '';
        }
      } else if (t.id === 'ar-shoe') {
        const inp = document.getElementById('ar-shoe-custom');
        if (t.value === '__custom__') {
          if (inp) inp.focus();
        } else if (inp) {
          inp.value = '';
        }
      }
    });

    // Map Hover Telemetry Readout
    document.addEventListener('mouseover', (e) => {
      const hit = e.target.closest('[data-map-hover]');
      if (!hit) return;
      const box = document.getElementById('hover-' + hit.getAttribute('data-map-hover'));
      if (box) { box.textContent = hit.getAttribute('data-hover-info'); box.style.display = 'flex'; }
    });
    document.addEventListener('mouseout', (e) => {
      const hit = e.target.closest('[data-map-hover]');
      if (!hit) return;
      const box = document.getElementById('hover-' + hit.getAttribute('data-map-hover'));
      if (box) box.style.display = 'none';
    });

    // Form Submissions
    document.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;

      if (f.id === 'add-shoe-form') {
        const brand = document.getElementById('shoe-brand').value.trim();
        const model = document.getElementById('shoe-model').value.trim();
        const maxKm = Math.max(200, parseInt(document.getElementById('shoe-max').value || '600', 10) || 600);
        if (!brand || !model) return;
        state.shoes.push({ id: 'shoe-' + Date.now(), brand, model, distanceKm: 0, maxKm, isPrimary: state.shoes.length === 0, retired: false });
        state.showAddShoe = false; saveLocalState(); render();
      } else if (f.id === 'add-run-form') {
        const title = document.getElementById('ar-title').value.trim();
        const dist = parseFloat(document.getElementById('ar-dist').value);
        const min = parseInt(document.getElementById('ar-min').value || '0', 10) || 0;
        const sec = parseInt(document.getElementById('ar-sec').value || '0', 10) || 0;
        const totalSec = min * 60 + sec;
        if (!title) { state.addRunError = '러닝 제목을 입력해 주세요.'; renderModals(); return; }
        if (!Number.isFinite(dist) || dist <= 0 || dist > 250) { state.addRunError = '거리는 0보다 크고 250km 이하로 입력해 주세요.'; renderModals(); return; }
        if (totalSec <= 0) { state.addRunError = '운동 시간을 1초 이상 입력해 주세요.'; renderModals(); return; }
        const avgPace = Math.round(totalSec / dist);
        const elev = Math.max(0, parseInt(document.getElementById('ar-elev').value || '0', 10) || 0);
        const hr = parseInt(document.getElementById('ar-hr').value || '0', 10);
        const preset = COURSE_PRESETS.find((c) => c.id === document.getElementById('ar-course').value) || COURSE_PRESETS[0];
        const arShoeCustom = (document.getElementById('ar-shoe-custom') ? document.getElementById('ar-shoe-custom').value : '').trim();
        const arShoeVal = document.getElementById('ar-shoe').value;
        const run = {
          id: 'run-' + Date.now(), title, date: document.getElementById('ar-date').value || REFERENCE_DATE,
          startTime: document.getElementById('ar-time').value || '07:00',
          workoutType: document.getElementById('ar-type').value,
          distanceKm: Number(dist.toFixed(2)), durationSec: totalSec, avgPaceSecPerKm: avgPace, elevationGainM: elev,
          avgHr: hr >= 40 && hr <= 220 ? hr : undefined, calories: Math.round(dist * 65),
          shoeId: (!arShoeCustom && arShoeVal && arShoeVal !== '__custom__') ? arShoeVal : undefined,
          shoeName: arShoeCustom ? arShoeCustom.slice(0, 120) : undefined,
          courseName: preset.name, notes: document.getElementById('ar-notes').value.trim() || undefined,
          route: enrichRoute(preset.route, avgPace),
          splits: generateSplitsFromTotal(dist, totalSec, elev, hr >= 40 ? hr : undefined)
        };
        state.showAddRunModal = false;
        await saveNewRun(run);
        render();
      } else if (f.id === 'plan-form') {
        state.plan = generatePersonalizedPlan({
          goal: document.getElementById('plan-goal').value,
          level: document.getElementById('plan-level').value,
          daysPerWeek: Number(document.getElementById('plan-days').value),
          benchmark5kMinutes: Number(document.getElementById('plan-5k').value),
          generatedAt: new Date().toISOString().slice(0, 10)
        });
        state.planWeekNum = 1; saveLocalState(); render(); showToast('맞춤형 8주 훈련 계획이 생성되었습니다.');
      } else if (f.id === 'share-post-form') {
        const run = state.runs.find((r) => r.id === document.getElementById('share-run-id').value) || state.runs[0];
        const cap = document.getElementById('share-caption').value.trim();
        if (run) await shareRunToFeed(run, cap || run.distanceKm + 'km 러닝 완료!');
      } else if (f.hasAttribute('data-form-comment')) {
        const postId = f.getAttribute('data-form-comment');
        const text = (state.commentDrafts[postId] || '').trim();
        if (!text) return;
        state.posts = state.posts.map((p) => p.id === postId ? {
          ...p, commentsCount: p.commentsCount + 1,
          comments: [...(p.comments || []), { id: 'c-' + Date.now(), authorId: 'me-local', authorName: state.user ? (state.user.displayName || '러너') : '나 (로컬 러너)', text: text.slice(0, 300), createdAtLabel: '방금 전' }]
        } : p);
        state.commentDrafts[postId] = '';
        saveLocalState(); render();
      } else if (f.id === 'create-chal-form') {
        const title = document.getElementById('chal-title').value.trim();
        const cat = document.getElementById('chal-cat').value;
        const target = parseFloat(document.getElementById('chal-target').value);
        const desc = document.getElementById('chal-desc').value.trim() || '함께 목표를 달성하는 러닝 챌린지입니다.';
        const endDate = document.getElementById('chal-end').value || '2026-12-15';
        if (!title || !Number.isFinite(target) || target <= 0) return;
        const unit = cat === 'distance' ? 'km' : cat === 'runs' ? '회' : 'm';
        const myVal = computeChallengeMetric(cat, REFERENCE_DATE, endDate);
        const myName = state.user ? (state.user.displayName || '러너') : '나 (로컬 러너)';
        state.challenges.unshift({
          id: 'chal-' + Date.now(), creatorId: 'me-local', creatorName: myName,
          title: title.slice(0, 100), description: desc.slice(0, 400), category: cat, targetValue: target, unit,
          startDate: REFERENCE_DATE, endDate, participantCount: 1, joinedByMe: true, myProgress: myVal,
          participants: [{ userId: 'me-local', displayName: myName, currentValue: myVal }]
        });
        state.showCreateChallenge = false; saveLocalState(); render(); showToast('"' + title + '" 챌린지가 개설되었습니다.');
      }
    });

    // Boot
    render();
    loadWeatherByGeo();
    initFirebaseCdn();
  })();
  </script>
</body>
</html>
