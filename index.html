    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatPace(secPerKm) {
      if (!Number.isFinite(secPerKm) || secPerKm <= 0) return "-'--\"";
      const r = Math.round(secPerKm);
      const m = Math.floor(r / 60);
      const s = r % 60;
      return m + "'" + String(s).padStart(2, '0') + '"';
    }

    function formatDuration(totalSec) {
      if (!Number.isFinite(totalSec) || totalSec < 0) return '00:00';
      const s = Math.round(totalSec);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function formatDurationKorean(totalSec) {
      const s = Math.round(totalSec || 0);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return h > 0 ? h + '시간 ' + m + '분' : m + '분';
    }

    function haversineDistanceKm(a, b) {
      const R = 6371;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const s1 = Math.sin(dLat / 2);
      const s2 = Math.sin(dLng / 2);
      const h = s1 * s1 + Math.cos(lat1) * Math.cos(lat2) * s2 * s2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function generateSplitsFromTotal(distanceKm, durationSec, elevationGainM, avgHr) {
      if (distanceKm <= 0 || durationSec <= 0) return [];
      const basePace = durationSec / distanceKm;
      const fullKms = Math.floor(distanceKm);
      const remainder = Number((distanceKm - fullKms).toFixed(2));
      const splits = [];
      const totalSegments = remainder > 0.05 ? fullKms + 1 : fullKms;
      const avgEleStep = totalSegments > 0 ? Math.round(elevationGainM / totalSegments) : 0;
      for (let i = 1; i <= fullKms; i++) {
        const wave = Math.sin(i * 1.4) * 6 - (i === fullKms ? 4 : 0);
        const segPace = Math.max(195, Math.round(basePace + wave));
        splits.push({
          km: i,
          distanceKm: 1,
          durationSec: segPace,
          paceSecPerKm: segPace,
          elevationDiff: avgEleStep + ((i % 3) - 1) * 2,
          avgHr: avgHr ? Math.round(avgHr + Math.min(8, i * 1.1)) : undefined
        });
      }
      if (remainder > 0.05) {
        const segPace = Math.max(195, Math.round(basePace - 5));
        splits.push({
          km: fullKms + 1,
          distanceKm: remainder,
          durationSec: Math.round(segPace * remainder),
          paceSecPerKm: segPace,
          elevationDiff: Math.max(0, avgEleStep),
          avgHr: avgHr ? Math.round(avgHr + 6) : undefined
        });
      }
      return splits;
    }

    function predictRaceTimeRiegel(knownDistKm, knownSec, targetDistKm) {
      if (knownDistKm <= 0 || knownSec <= 0 || targetDistKm <= 0) return 0;
      return Math.round(knownSec * Math.pow(targetDistKm / knownDistKm, 1.06));
    }

    function getStartOfWeekIso(dateStr) {
      const parts = dateStr.split('-').map(Number);
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      const day = dt.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      dt.setDate(dt.getDate() + diff);
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }

    function addDaysIso(dateStr, days) {
      const parts = dateStr.split('-').map(Number);
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      dt.setDate(dt.getDate() + days);
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }

    function computeWeeklyBuckets(runs, refDate, numWeeks) {
      const curStart = getStartOfWeekIso(refDate);
      const out = [];
      for (let w = numWeeks - 1; w >= 0; w--) {
        const start = addDaysIso(curStart, -w * 7);
        const end = addDaysIso(start, 6);
        const wr = runs.filter((r) => r.date >= start && r.date <= end);
        const dist = Number(wr.reduce((a, r) => a + r.distanceKm, 0).toFixed(1));
        const dur = wr.reduce((a, r) => a + r.durationSec, 0);
        const elev = wr.reduce((a, r) => a + r.elevationGainM, 0);
        const p = start.split('-');
        out.push({
          label: Number(p[1]) + '/' + Number(p[2]),
          distanceKm: dist,
          durationSec: dur,
          runCount: wr.length,
          avgPaceSec: dist > 0 ? Math.round(dur / dist) : 0,
          elevationGainM: elev
        });
      }
      return out;
    }

    function computeMonthlyBuckets(runs, refDate, numMonths) {
      const p = refDate.split('-').map(Number);
      const out = [];
      for (let i = numMonths - 1; i >= 0; i--) {
        const d = new Date(p[0], p[1] - 1 - i, 1);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        const mr = runs.filter((r) => r.date.startsWith(key));
        const dist = Number(mr.reduce((a, r) => a + r.distanceKm, 0).toFixed(1));
        const dur = mr.reduce((a, r) => a + r.durationSec, 0);
        const elev = mr.reduce((a, r) => a + r.elevationGainM, 0);
        out.push({
          label: (d.getMonth() + 1) + '월',
          distanceKm: dist,
          durationSec: dur,
          runCount: mr.length,
          avgPaceSec: dist > 0 ? Math.round(dur / dist) : 0,
          elevationGainM: elev
        });
      }
      return out;
    }

    function buildPersonalizedZones(benchmark5kMin) {
      const base = Math.max(960, Math.min(2700, benchmark5kMin * 60));
      const p5 = base / 5;
      const fmtR = (a, b) => formatPace(Math.round(p5 * a)) + ' ~ ' + formatPace(Math.round(p5 * b)) + '/km';
      return [
        { zone: 'Zone 1', name: '회복 조깅 (Recovery)', hrPercent: '60–68% HRmax', rpe: 'RPE 2–3', paceRange: fmtR(1.32, 1.44), talkTest: '노래를 부르거나 긴 대화가 매우 편한 속도' },
        { zone: 'Zone 2', name: '이지 런 (Aerobic Base)', hrPercent: '69–78% HRmax', rpe: 'RPE 4–5', paceRange: fmtR(1.18, 1.30), talkTest: '완전한 문장으로 편하게 대화 가능한 속도' },
        { zone: 'Zone 3', name: '마라톤 스테디 (Steady)', hrPercent: '79–84% HRmax', rpe: 'RPE 6–7', paceRange: fmtR(1.09, 1.16), talkTest: '짧은 문장으로만 대답할 수 있는 리드미컬한 속도' },
        { zone: 'Zone 4', name: '젖산 역치 템포 (Threshold)', hrPercent: '85–91% HRmax', rpe: 'RPE 7–8', paceRange: fmtR(1.02, 1.07), talkTest: '단어 2~3개 정도만 말할 수 있는 집중 강도' },
        { zone: 'Zone 5', name: 'VO2Max 인터벌 (Interval)', hrPercent: '92–98% HRmax', rpe: 'RPE 9–10', paceRange: fmtR(0.93, 0.99), talkTest: '대화가 어렵고 호흡이 가빠지는 고강도 질주' }
      ];
    }

    function generatePersonalizedPlan(config) {
      const zones = buildPersonalizedZones(config.benchmark5kMinutes);
      const z1 = zones[0].paceRange, z2 = zones[1].paceRange, z3 = zones[2].paceRange, z4 = zones[3].paceRange, z5 = zones[4].paceRange;
      const dayNames = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
      const mult = config.level === 'beginner' ? 1 : config.level === 'intermediate' ? 1.55 : 2.15;
      const goalBase = { fitness: 14, '5k': 15, '10k': 20, half: 26, full: 34 };
      const baseWeeklyKm = goalBase[config.goal] * mult;
      const phaseMeta = [
        { name: '기초 적응기', factor: 0.78, focus: '관절·인대 적응과 Zone 2 유산소 베이스 확립' },
        { name: '기초 적응기', factor: 0.86, focus: '일정한 리듬의 주간 주행거리 확보' },
        { name: '볼륨 빌드업', factor: 0.96, focus: '젖산 역치 자극과 점진적 장거리 연장' },
        { name: '회복 디로딩', factor: 0.75, focus: '누적 피로 해소 및 다음 주기 대비 슈퍼컴펜세이션' },
        { name: '스피드·역치 강화', factor: 1.05, focus: '목표 레이스 페이스 적응 및 인터벌 스피드 자극' },
        { name: '피크 볼륨', factor: 1.12, focus: '가장 긴 장거리 러닝과 주간 최대 훈련량 소화' },
        { name: '레이스 시뮬레이션', factor: 0.92, focus: '컨디션 조절 및 실전 페이스 점검' },
        { name: '테이퍼링 · 피킹', factor: 0.65, focus: '근육 글리코겐 충전과 최상의 레이스 컨디션 완성' }
      ];
      const patterns = { 3: [1, 3, 6], 4: [1, 2, 4, 6], 5: [0, 1, 3, 4, 6], 6: [0, 1, 2, 3, 4, 6] };
      const activeDays = patterns[config.daysPerWeek] || patterns[4];
      const weeks = [];

      for (let w = 0; w < 8; w++) {
        const phase = phaseMeta[w];
        const targetWeekKm = Math.round(baseWeeklyKm * phase.factor);
        const sessions = dayNames.map((dayLabel, dayIdx) => {
          if (!activeDays.includes(dayIdx)) {
            if (dayIdx === 5 && config.daysPerWeek <= 5) {
              return {
                dayIndex: dayIdx, dayLabel, workoutType: 'strength',
                title: '하체 코어 보강 · 모빌리티',
                description: config.level === 'beginner'
                  ? '스쿼트, 런지, 플랭크 각 2세트 및 발목·고관절 스트레칭 20분'
                  : '싱글레그 데드리프트, 카프 레이즈, 힙 쓰러스트 3세트 + 폼롤링 25분',
                targetDistanceKm: 0, targetPaceRange: '체중 보강 운동', targetHrZone: 'Zone 1', rpeRange: 'RPE 4–5'
              };
            }
            return {
              dayIndex: dayIdx, dayLabel, workoutType: 'rest',
              title: '완전 휴식 및 회복',
              description: '근섬유 재생과 수면 7~8시간 확보, 가벼운 스트레칭만 권장',
              targetDistanceKm: 0, targetPaceRange: '휴식', targetHrZone: '회복', rpeRange: 'RPE 1'
            };
          }
          if (dayIdx === 6) {
            const longKm = Math.max(config.level === 'beginner' ? 5 : 8, Math.round(targetWeekKm * (config.goal === 'full' ? 0.36 : 0.32)));
            return {
              dayIndex: dayIdx, dayLabel, workoutType: 'long',
              title: w === 7 ? '최종 점검 / 목표 레이스 데이' : '주말 장거리 LSD (' + longKm + 'km)',
              description: config.level === 'beginner'
                ? '대화 가능한 편안한 속도로 멈추지 않고 완주하는 데 집중하세요. 30분마다 수분 보충.'
                : '초반 60%는 Zone 2로 안정적으로 출발하고, 후반 2~3km는 마라톤/스테디 페이스로 자연스럽게 마무리.',
              targetDistanceKm: longKm,
              targetPaceRange: w >= 4 && config.level !== 'beginner' ? z2 + ' → ' + z3 : z2,
              targetHrZone: 'Zone 2–3', rpeRange: 'RPE 5–6'
            };
          }
          const qualityDay = activeDays.includes(3) ? 3 : 2;
          if (dayIdx === qualityDay) {
            const isInterval = w % 2 === 1 && w !== 3 && w !== 7;
            const qKm = Math.max(4, Math.round(targetWeekKm * 0.22));
            if (config.level === 'beginner' && w < 2) {
              return {
                dayIndex: dayIdx, dayLabel, workoutType: 'easy',
                title: '빌드업 조깅 + 스트라이드 4회',
                description: '편안한 이지 런 후 마지막에 100m 경쾌한 가속 주행(스트라이드) 4세트를 추가합니다.',
                targetDistanceKm: qKm, targetPaceRange: z2, targetHrZone: 'Zone 2', rpeRange: 'RPE 4–5'
              };
            }
            if (isInterval) {
              const reps = config.level === 'beginner' ? '400m × 5회' : config.level === 'intermediate' ? '800m × 5회' : '1,000m × 6회';
              return {
                dayIndex: dayIdx, dayLabel, workoutType: 'interval',
                title: '트랙 인터벌 (' + reps + ')',
                description: '워밍업 1.5km 후 본 세트(' + reps + ', 휴식 조깅 200m) 및 쿨다운 1km 진행.',
                targetDistanceKm: qKm, targetPaceRange: z5, targetHrZone: 'Zone 5', rpeRange: 'RPE 8–9'
              };
            }
            const tMin = config.level === 'beginner' ? 15 : config.level === 'intermediate' ? 25 : 35;
            return {
              dayIndex: dayIdx, dayLabel, workoutType: 'tempo',
              title: '역치 템포 런 (' + tMin + '분 지속주)',
              description: '워밍업 1.5km 후 일정한 역치 강도로 ' + tMin + '분간 리듬을 유지한 뒤 쿨다운 1km.',
              targetDistanceKm: qKm, targetPaceRange: z4, targetHrZone: 'Zone 4', rpeRange: 'RPE 7–8'
            };
          }
          if (dayIdx === 1 && config.level !== 'beginner' && w >= 2 && w !== 7) {
            const sKm = Math.max(5, Math.round(targetWeekKm * 0.18));
            return {
              dayIndex: dayIdx, dayLabel,
              workoutType: config.level === 'advanced' ? 'tempo' : 'easy',
              title: config.level === 'advanced' ? '스테디 프로그레션 런 (' + sKm + 'km)' : '유산소 페이스 런 (' + sKm + 'km)',
              description: '일정한 케이던스(175~182spm)를 유지하며 가볍고 경쾌한 착지에 집중합니다.',
              targetDistanceKm: sKm, targetPaceRange: config.level === 'advanced' ? z3 : z2,
              targetHrZone: config.level === 'advanced' ? 'Zone 3' : 'Zone 2', rpeRange: 'RPE 5–6'
            };
          }
          const rem = Math.max(1, activeDays.length - 2);
          const easyKm = Math.max(3, Math.round((targetWeekKm * 0.44) / rem));
          const isRec = dayIdx === 0;
          return {
            dayIndex: dayIdx, dayLabel, workoutType: 'easy',
            title: isRec ? '회복 이지 런 (' + easyKm + 'km)' : '유산소 이지 런 (' + easyKm + 'km)',
            description: isRec
              ? '주말 장거리 후 피로 회복을 위한 저강도 조깅. 심박수가 오르지 않게 천천히 달리세요.'
              : '호흡이 편안한 Zone 2 영역에서 착지 충격과 자세 밸런스를 점검합니다.',
            targetDistanceKm: easyKm, targetPaceRange: isRec ? z1 : z2,
            targetHrZone: isRec ? 'Zone 1' : 'Zone 2', rpeRange: isRec ? 'RPE 2–3' : 'RPE 4'
          };
        });
        weeks.push({
          weekNumber: w + 1,
          phaseName: phase.name,
          focusSummary: phase.focus,
          totalKm: sessions.reduce((a, s) => a + s.targetDistanceKm, 0),
          sessions
        });
      }

      return {
        config,
        title: LEVEL_LABELS[config.level] + ' ' + GOAL_LABELS[config.goal] + ' 8주 로드맵',
        summary: '주 ' + config.daysPerWeek + '회 훈련 · 기준 5K ' + config.benchmark5kMinutes + '분 기반 개인화 페이스 존 적용',
        weeks,
        zones,
        completedSessions: {}
      };
    }

    function getPaceColor(paceSec) {
      if (!paceSec || paceSec <= 0) return '#EA580C';
      if (paceSec <= 285) return '#E11D48';
      if (paceSec <= 325) return '#EA580C';
      return '#16A34A';
    }

    function renderRouteMap(mapId, points, heightPx, showControls, showBeacon) {
      const zoom = state.mapZooms[mapId] || 1;
      const W = 640, H = 380, pad = 44;
      let coords = [], kmMarkers = [], scaleLabel = '200 m', centerText = '37.5150° N, 127.0050° E';

      if (points && points.length > 0) {
        const lats = points.map((p) => p.lat), lngs = points.map((p) => p.lng);
        const minLat = Math.min(...lats), maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
        const midLat = (minLat + maxLat) / 2, midLng = (minLng + maxLng) / 2;
        const lngScale = Math.cos((midLat * Math.PI) / 180);
        const spanX = Math.max(0.0018, (maxLng - minLng) * lngScale);
        const spanY = Math.max(0.0018, maxLat - minLat);
        const fitScale = Math.min((W - pad * 2) / spanX, (H - pad * 2) / spanY) * zoom;

        let cumKm = 0;
        coords = points.map((pt, i) => {
          if (i > 0) cumKm += haversineDistanceKm(points[i - 1], pt);
          return {
            x: W / 2 + (pt.lng - midLng) * lngScale * fitScale,
            y: H / 2 - (pt.lat - midLat) * fitScale,
            pt, cumKm
          };
        });

        let nextKm = 1;
        for (let i = 1; i < coords.length; i++) {
          if (coords[i].cumKm >= nextKm) {
            kmMarkers.push({ km: nextKm, x: coords[i].x, y: coords[i].y });
            nextKm++;
          }
        }
        const kmPer80 = (80 / fitScale) * 111.32;
        scaleLabel = kmPer80 >= 1 ? kmPer80.toFixed(1) + ' km' : Math.max(20, Math.round(kmPer80 * 1000)) + ' m';
        centerText = midLat.toFixed(4) + '° N, ' + midLng.toFixed(4) + '° E';
      }

      const patId = 'grid-' + mapId.replace(/[^a-zA-Z0-9]/g, '');
      const polyStr = coords.map((c) => c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
      let segs = '';
      for (let i = 1; i < coords.length; i++) {
        const prev = coords[i - 1], cur = coords[i];
        segs += '<line x1="' + prev.x.toFixed(1) + '" y1="' + prev.y.toFixed(1) + '" x2="' + cur.x.toFixed(1) + '" y2="' + cur.y.toFixed(1) + '" stroke="' + getPaceColor(cur.pt.paceSecPerKm) + '" stroke-width="4.5" stroke-linecap="round" />';
      }
      const hits = coords.map((c) => {
        const info = c.cumKm.toFixed(2) + ' km' + (c.pt.paceSecPerKm ? ' · ' + formatPace(c.pt.paceSecPerKm) + '/km' : '') + (c.pt.ele !== undefined ? ' · 고도 ' + Math.round(c.pt.ele) + ' m' : '');
        return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="10" fill="transparent" data-map-hover="' + esc(mapId) + '" data-hover-info="' + esc(info) + '" style="cursor:pointer" />';
      }).join('');

      const markers = kmMarkers.map((m) =>
        '<g transform="translate(' + m.x.toFixed(1) + ',' + m.y.toFixed(1) + ')"><circle r="9" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.8"/><text y="3.5" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="JetBrains Mono, monospace">' + m.km + '</text></g>'
      ).join('');

      const startPt = coords[0], endPt = coords[coords.length - 1];
      const startSvg = startPt ? '<circle cx="' + startPt.x.toFixed(1) + '" cy="' + startPt.y.toFixed(1) + '" r="7" fill="#16A34A" stroke="#FFFFFF" stroke-width="2.5"/>' : '';
      const endSvg = endPt ? (showBeacon ? '<circle cx="' + endPt.x.toFixed(1) + '" cy="' + endPt.y.toFixed(1) + '" r="15" fill="#EA580C" opacity="0.22"/>' : '') + '<circle cx="' + endPt.x.toFixed(1) + '" cy="' + endPt.y.toFixed(1) + '" r="7.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="2.5"/>' : '';

      return '' +
        '<div class="map-box" style="height:' + (heightPx || 280) + 'px;" data-map-wrap="' + esc(mapId) + '">' +
          '<svg viewBox="0 0 640 380" style="width:100%;height:100%;display:block;" role="img" aria-label="GPS 경로 지도">' +
            '<defs>' +
              '<pattern id="' + patId + '-m" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.8"/></pattern>' +
              '<pattern id="' + patId + '" width="128" height="128" patternUnits="userSpaceOnUse"><rect width="128" height="128" fill="url(#' + patId + '-m)"/><path d="M 128 0 L 0 0 0 128" fill="none" stroke="#CBD5E1" stroke-width="1.1"/></pattern>' +
            '</defs>' +
            '<rect width="640" height="380" fill="#F4F6F5"/>' +
            '<rect width="640" height="380" fill="url(#' + patId + ')"/>' +
            '<path d="M -20 315 Q 170 265 340 295 T 660 250 L 660 390 L -20 390 Z" fill="#DDE9EC" opacity="0.65"/>' +
            '<path d="M 40 70 Q 210 30 390 85 T 620 55" fill="none" stroke="#DCE5DD" stroke-width="28" stroke-linecap="round" opacity="0.55"/>' +
            (coords.length === 0
              ? '<text x="320" y="190" text-anchor="middle" fill="#64748B" font-size="13" font-weight="500">GPS 경로 좌표가 기록되면 지도에 표시됩니다</text>'
              : '<polyline fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="' + polyStr + '"/>' + segs + markers + startSvg + endSvg + hits) +
          '</svg>' +
          '<div class="map-overlay-top">' +
            '<span class="font-mono-tab semi" style="color:#0F172A;">' + centerText + '</span>' +
            '<span style="color:#CBD5E1;">|</span>' +
            '<span class="flex items-center gap-1"><span style="width:10px;height:4px;border-radius:99px;background:#16A34A;display:inline-block;"></span>이지</span>' +
            '<span class="flex items-center gap-1"><span style="width:10px;height:4px;border-radius:99px;background:#EA580C;display:inline-block;"></span>템포</span>' +
            '<span class="flex items-center gap-1"><span style="width:10px;height:4px;border-radius:99px;background:#E11D48;display:inline-block;"></span>질주</span>' +
          '</div>' +
          '<div class="map-hover-pill font-mono-tab" id="hover-' + esc(mapId) + '" style="display:none;"></div>' +
          '<div class="map-scale font-mono-tab"><span style="width:44px;height:6px;border-left:1px solid #334155;border-right:1px solid #334155;border-bottom:1px solid #334155;display:inline-block;"></span><span>' + scaleLabel + '</span></div>' +
          (showControls !== false ? (
            '<div class="map-controls">' +
              '<button type="button" class="map-ctrl-btn" data-action="map-zoom" data-map-id="' + esc(mapId) + '" data-delta="0.35" aria-label="확대">' + svgIcon('plus', 14) + '</button>' +
              '<button type="button" class="map-ctrl-btn" data-action="map-zoom" data-map-id="' + esc(mapId) + '" data-delta="-0.35" aria-label="축소">' + svgIcon('minus', 14) + '</button>' +
              '<button type="button" class="map-ctrl-btn" data-action="map-reset" data-map-id="' + esc(mapId) + '" aria-label="전체 보기">' + svgIcon('max', 14) + '</button>' +
            '</div>'
          ) : '') +
        '</div>';
    }

    function renderCourseCardVisual(course) {
      const palettes = {
        river: { bg: '#E6F0F3', accent: '#0284C7', hill: '#CBDDE4' },
        lake: { bg: '#EAF2EE', accent: '#0D9488', hill: '#D2E5DE' },
        park: { bg: '#EDF3EA', accent: '#16A34A', hill: '#D6E4D1' },
        track: { bg: '#FDF0EB', accent: '#EA580C', hill: '#F5D6CA' },
        forest: { bg: '#EAF1E8', accent: '#15803D', hill: '#CFE0CC' },
        ocean: { bg: '#E5EFF8', accent: '#2563EB', hill: '#C9DDF0' },
        mountain: { bg: '#EFF1EF', accent: '#EA580C', hill: '#D5DBD7' }
      };
      const pal = palettes[course.theme] || palettes.river;
      const pts = course.route;
      const lats = pts.map((p) => p.lat), lngs = pts.map((p) => p.lng);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
      const midLat = (minLat + maxLat) / 2, midLng = (minLng + maxLng) / 2;
      const lngScale = Math.cos((midLat * Math.PI) / 180);
      const spanX = Math.max(0.002, (maxLng - minLng) * lngScale);
      const spanY = Math.max(0.002, maxLat - minLat);
      const scale = Math.min(220 / spanX, 110 / spanY);
      const poly = pts.map((p) => {
        const x = 160 + (p.lng - midLng) * lngScale * scale;
        const y = 90 - (p.lat - midLat) * scale;
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      const start = poly.split(' ')[0].split(',');
      return '' +
        '<svg viewBox="0 0 320 180" style="width:100%;height:100%;display:block;" aria-hidden="true">' +
          '<rect width="320" height="180" fill="' + pal.bg + '"/>' +
          '<path d="M 0 140 Q 90 110 180 132 T 320 118 L 320 180 L 0 180 Z" fill="' + pal.hill + '"/>' +
          '<polyline fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="' + poly + '"/>' +
          '<polyline fill="none" stroke="' + pal.accent + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="' + poly + '"/>' +
          '<circle cx="' + start[0] + '" cy="' + start[1] + '" r="5" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>' +
        '</svg>';
    }

    // Weather Logic
    function describeWmoCode(code) {
      if (code === 0 || code === 1) return { label: '맑음', isRain: false, isSnow: false, kind: 'sun' };
      if (code === 2 || code === 3) return { label: '구름 많음', isRain: false, isSnow: false, kind: 'cloud' };
      if (code === 45 || code === 48) return { label: '안개', isRain: false, isSnow: false, kind: 'cloud' };
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { label: '비', isRain: true, isSnow: false, kind: 'rain' };
      if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { label: '눈', isRain: false, isSnow: true, kind: 'snow' };
      if (code >= 95) return { label: '뇌우', isRain: true, isSnow: false, kind: 'storm' };
      return { label: '흐림', isRain: false, isSnow: false, kind: 'cloud' };
    }

    function computeWeatherRecommendation(w) {
      const feel = w.apparentTemperature, humidity = w.humidity, wind = w.windSpeedMs, precip = w.precipitationMm;
      const cond = describeWmoCode(w.weatherCode);
      const wet = cond.isRain || cond.isSnow || precip > 0.2;
      const windy = wind >= 5.5;
      let top = '', bottom = '', accessories = '';

      if (feel >= 24) {
        top = '초경량 싱글렛 또는 메쉬 반팔'; bottom = '통기성 러닝 쇼츠 (3~5인치)'; accessories = '통풍 러닝 캡 · 선글라스 · 자외선 차단제';
      } else if (feel >= 17) {
        top = '흡한속건 기능성 반팔 티셔츠'; bottom = '러닝 쇼츠 또는 가벼운 하프 타이츠'; accessories = '러닝 양말 · 햇빛 강할 시 경량 모자';
      } else if (feel >= 10) {
        top = '얇은 긴팔 기능성 톱 (또는 반팔 + 암워머)'; bottom = '쇼츠 또는 7부·하프 타이츠'; accessories = windy ? '초경량 방풍 베스트 지참 권장' : '가벼운 스포츠 선글라스';
      } else if (feel >= 4) {
        top = '보온 긴팔 베이스레이어 + 경량 윈드브레이커'; bottom = '러닝 롱 타이츠 또는 기모 쇼츠 레깅스'; accessories = '얇은 러닝 장갑 · 넥워머 (초반 체온 유지)';
      } else {
        top = '기모 베이스레이어 + 방풍 보온 러닝 재킷'; bottom = '기모 방풍 롱 타이츠'; accessories = '방한 장갑 · 비니 또는 이어워머 · 발목 보온 양말';
      }
      if (wet) accessories = '발수 챙 모자(우천 시야 확보) · ' + accessories;

      let intensityTitle = '', intensityBadge = '', paceAdjustment = '', advice = '';
      if (cond.kind === 'storm') {
        intensityTitle = '실내 트레드밀 · 보강 운동 전환 권장'; intensityBadge = '기상 주의'; paceAdjustment = '실외 주행 자제';
        advice = '뇌우·강우 상황에서는 낙뢰 및 미끄럼 위험이 높으므로 실내 러닝이나 하체 코어 보강을 권장합니다.';
      } else if (wet) {
        intensityTitle = '이지 런 (Zone 2) · 케이던스 위주 주행'; intensityBadge = '노면 주의'; paceAdjustment = '+10~15초/km 여유';
        advice = '젖은 노면에서는 보폭을 줄이고 착지 안정성을 우선하세요. 급격한 코너링이나 인터벌 질주는 피하는 편이 안전합니다.';
      } else if (feel >= 27 || (feel >= 23 && humidity >= 78)) {
        intensityTitle = '저강도 회복 조깅 (Zone 1–2)'; intensityBadge = '고온·고습'; paceAdjustment = '+25~35초/km 완화';
        advice = '체온 상승과 탈수 속도가 빠릅니다. 15~20분마다 수분·전해질을 보충하고 새벽이나 해 진 뒤 주행을 권장합니다.';
      } else if (feel >= 21) {
        intensityTitle = '유산소 이지 런 · 스테디 런'; intensityBadge = '더위 보정'; paceAdjustment = '+10~20초/km 완화';
        advice = '심박수가 평소보다 5~10bpm 높게 올라갈 수 있으니 목표 페이스보다 심박 존(Zone 2~3) 기준으로 강도를 조절하세요.';
      } else if (feel >= 8 && feel < 18 && !windy) {
        intensityTitle = '템포 런 · 인터벌 · PR 도전 최적'; intensityBadge = '최적 컨디션'; paceAdjustment = '목표 페이스 100% 수행';
        advice = '열 발산과 산소 효율이 가장 좋은 러닝 골든 기온입니다. 역치 템포나 트랙 인터벌 같은 고강도 세션에 적합합니다.';
      } else if (feel >= 1) {
        intensityTitle = '스테디 · 템포 런 (충분한 워밍업 필수)'; intensityBadge = '선선·쌀쌀'; paceAdjustment = windy ? '맞바람 구간 +10초/km' : '목표 페이스 유지 가능';
        advice = '관절과 아킬레스건이 굳어 있을 수 있으므로 본 주행 전 10분간 동적 스트레칭과 가벼운 조깅으로 체온을 올리세요.';
      } else {
        intensityTitle = '유산소 이지 런 (Zone 2) 또는 실내 주행'; intensityBadge = '한파 주의'; paceAdjustment = '+15~20초/km 완화';
        advice = '차가운 공기로 기관지가 자극될 수 있어 고강도 인터벌(Zone 5)은 피하고, 코 호흡·넥워머를 활용해 일정한 리듬으로 달리세요.';
      }
      return { cond, top, bottom, accessories, intensityTitle, intensityBadge, paceAdjustment, advice };
    }

    async function fetchWeather(lat, lng, label) {
      state.weatherLoading = true;
      render();
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(4) + '&longitude=' + lng.toFixed(4) +
          '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=1';
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const cur = data.current;
        const nowH = new Date().getHours();
        const times = (data.hourly && data.hourly.time) || [];
        const temps = (data.hourly && data.hourly.temperature_2m) || [];
        const probs = (data.hourly && data.hourly.precipitation_probability) || [];
        const nextH = [];
        for (let i = 0; i < times.length && nextH.length < 4; i++) {
          const hp = parseInt(times[i].slice(11, 13), 10);
          if (hp >= nowH) nextH.push({ timeLabel: String(hp).padStart(2, '0') + '시', temp: Math.round(temps[i] ?? cur.temperature_2m), precipProb: Math.round(probs[i] ?? 0) });
        }
        state.weather = {
          locationLabel: label, lat, lng,
          temperature: Number(cur.temperature_2m.toFixed(1)),
          apparentTemperature: Number(cur.apparent_temperature.toFixed(1)),
          humidity: Math.round(cur.relative_humidity_2m),
          windSpeedMs: Number(cur.wind_speed_10m.toFixed(1)),
          precipitationMm: Number((cur.precipitation ?? 0).toFixed(1)),
          weatherCode: Number(cur.weather_code ?? 0),
          hourlyNext: nextH
        };
      } catch (e) {
        state.weather = {
          locationLabel: label + ' (기본 기준)', lat, lng,
          temperature: 12.4, apparentTemperature: 10.8, humidity: 52, windSpeedMs: 2.8, precipitationMm: 0, weatherCode: 1,
          hourlyNext: [
            { timeLabel: '지금', temp: 12, precipProb: 10 },
            { timeLabel: '+1h', temp: 11, precipProb: 10 },
            { timeLabel: '+2h', temp: 10, precipProb: 15 },
            { timeLabel: '+3h', temp: 9, precipProb: 15 }
          ]
        };
      } finally {
        state.weatherLoading = false;
        render();
      }
    }

    function loadWeatherByGeo() {
      state.weatherCityId = 'auto';
      state.weatherGeoMsg = '';
      if (!('geolocation' in navigator)) {
        state.weatherGeoMsg = '브라우저 위치 지원 불가 · 서울 기준 날씨 표시';
        fetchWeather(CITY_PRESETS[0].lat, CITY_PRESETS[0].lng, '서울 (기본 위치)');
        return;
      }
      state.weatherLoading = true;
      render();
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.weatherGeoMsg = '현재 GPS 위치 기반 실시간 날씨';
          fetchWeather(pos.coords.latitude, pos.coords.longitude, '현재 내 위치');
        },
        () => {
          state.weatherGeoMsg = '위치 권한 미허용 · 서울 기준 날씨 표시';
          fetchWeather(CITY_PRESETS[0].lat, CITY_PRESETS[0].lng, '서울 (기본 위치)');
        },
        { timeout: 5000, maximumAge: 300000 }
      );
    }

    function renderDashboard() {
      const weekStart = getStartOfWeekIso(REFERENCE_DATE);
      const weekEnd = addDaysIso(weekStart, 6);
      const monthPrefix = REFERENCE_DATE.slice(0, 7);
      const weekRuns = state.runs.filter((r) => r.date >= weekStart && r.date <= weekEnd);
      const monthRuns = state.runs.filter((r) => r.date.startsWith(monthPrefix));
      const weekKm = weekRuns.reduce((a, r) => a + r.distanceKm, 0);
      const weekSec = weekRuns.reduce((a, r) => a + r.durationSec, 0);
      const weekElev = weekRuns.reduce((a, r) => a + r.elevationGainM, 0);
      const monthKm = monthRuns.reduce((a, r) => a + r.distanceKm, 0);
      const avgPace = weekKm > 0 ? Math.round(weekSec / weekKm) : 0;
      const pct = Math.min(100, Math.round((weekKm / Math.max(1, state.weeklyGoalKm)) * 100));

      const dayLabels = ['월', '화', '수', '목', '금', '토', '일'];
      const daily = dayLabels.map((lbl, idx) => {
        const dStr = addDaysIso(weekStart, idx);
        const km = weekRuns.filter((r) => r.date === dStr).reduce((a, r) => a + r.distanceKm, 0);
        return { label: lbl, dateStr: dStr, km: Number(km.toFixed(1)) };
      });
      const maxDay = Math.max(10, ...daily.map((d) => d.km));
      const nextSess = state.plan && state.plan.weeks[0] ? state.plan.weeks[0].sessions.find((s) => s.workoutType !== 'rest') : null;

      // Latest route silhouette for editorial dark anchor
      const heroPts = (state.runs[0] && state.runs[0].route && state.runs[0].route.length > 1) ? state.runs[0].route : ROUTES.han;
      const hLats = heroPts.map((p) => p.lat), hLngs = heroPts.map((p) => p.lng);
      const hMinLat = Math.min(...hLats), hMaxLat = Math.max(...hLats), hMinLng = Math.min(...hLngs), hMaxLng = Math.max(...hLngs);
      const hMidLat = (hMinLat + hMaxLat) / 2, hMidLng = (hMinLng + hMaxLng) / 2;
      const hScale = Math.min(340 / Math.max(0.002, (hMaxLng - hMinLng) * Math.cos((hMidLat * Math.PI) / 180)), 180 / Math.max(0.002, hMaxLat - hMinLat));
      const heroPoly = heroPts.map((p) => (220 + (p.lng - hMidLng) * Math.cos((hMidLat * Math.PI) / 180) * hScale).toFixed(1) + ',' + (120 - (p.lat - hMidLat) * hScale).toFixed(1)).join(' ');

                '<h2 class="font-display text-balance" style="margin:0;font-size:24px;line-height:1.3;">꾸준한 리듬이 다음 레이스의 페이스를 만듭니다</h2>' +
                '<div class="flex flex-wrap items-center gap-3 text-xs" style="color:#E2E8F0;">' +
                  '<span class="font-mono-tab">월간 누적 ' + monthKm.toFixed(1) + ' km</span><span>·</span>' +
                  '<span class="font-mono-tab">총 ' + monthRuns.length + '회 러닝</span><span>·</span>' +

            '</div>' +
          '</section>' +

          '<section class="grid-kpi">' +
            '<div class="card-tight"><div class="text-xs muted">이번 주 러닝 횟수</div><div class="font-display bold tabular-nums" style="font-size:24px;margin-top:4px;">' + weekRuns.length + '회</div><div class="text-xs muted font-mono-tab" style="margin-top:4px;">주간 ' + weekKm.toFixed(1) + ' km 완료</div></div>' +
            '<div class="card-tight"><div class="text-xs muted">이번 주 평균 페이스</div><div class="font-mono-tab bold" style="font-size:24px;margin-top:4px;">' + (avgPace > 0 ? formatPace(avgPace) : "-'--\"") + '<span class="text-sm muted" style="font-weight:400;">/km</span></div><div class="text-xs muted" style="margin-top:4px;">주간 전체 활동 기준</div></div>' +
            '<div class="card-tight"><div class="text-xs muted">이번 주 총 운동 시간</div><div class="font-display bold tabular-nums" style="font-size:24px;margin-top:4px;">' + formatDurationKorean(weekSec) + '</div><div class="text-xs muted font-mono-tab" style="margin-top:4px;">누적 상승 고도 +' + weekElev + ' m</div></div>' +
            '<div class="card-tight"><div class="text-xs muted">이번 달 누적 거리</div><div class="font-display bold tabular-nums" style="font-size:24px;margin-top:4px;">' + monthKm.toFixed(1) + ' <span class="text-sm muted" style="font-weight:400;">km</span></div><div class="text-xs" style="margin-top:4px;"><button type="button" class="accent semi" data-action="nav" data-tab="analytics">주간·월간 추이 분석 →</button></div></div>' +
          '</section>' +

          renderWeatherWidget() +

          '<section class="grid-12">' +
            '<div class="lg-span-7 card stack-sm">' +
              '<div class="flex items-center justify-between"><h2 class="text-base bold" style="margin:0;">최근 러닝 기록</h2><button type="button" class="text-xs semi accent" data-action="nav" data-tab="analytics">전체 일지 보기</button></div>' +
              (state.runs.length === 0 ? '<div class="muted text-sm" style="padding:36px 0;text-align:center;">아직 기록된 러닝이 없습니다.</div>' : '<div class="divider-y">' + recentHtml + '</div>') +
            '</div>' +
            '<div class="lg-span-5 card stack-sm">' +
              '<div class="flex items-center justify-between"><div><h2 class="text-base bold" style="margin:0;">러닝화 마일리지 관리</h2><p class="text-xs muted" style="margin:2px 0 0;">기록 저장 시 주행 거리가 자동 합산됩니다</p></div><button type="button" class="btn-soft btn-sm" data-action="toggle-add-shoe">' + svgIcon('plus', 13) + '추가</button></div>' +
              (state.showAddShoe ? (
                '<form id="add-shoe-form" class="sub-box stack-sm">' +
                  '<div class="grid-2"><input id="shoe-brand" class="input" placeholder="브랜드 (예: HOKA)" required /><input id="shoe-model" class="input" placeholder="모델명 (예: Clifton 9)" required /></div>' +
                  '<div class="flex items-center justify-between gap-2"><div class="flex items-center gap-2 text-xs muted"><span>교체 주기</span><input id="shoe-max" type="number" min="200" max="1500" value="600" class="input font-mono-tab" style="width:76px;padding:4px 8px;" /><span>km</span></div><button type="submit" class="btn-primary btn-sm">등록</button></div>' +
                '</form>'
              ) : '') +
              '<div class="divider-y">' + shoesHtml + '</div>' +
            '</div>' +
          '</section>' +
        '</div>';
    }

    function renderLiveRun() {
      const course = COURSE_PRESETS.find((c) => c.id === state.liveCourseId) || COURSE_PRESETS[0];
      const activeShoes = state.shoes.filter((s) => !s.retired);
      const avgPace = state.liveDistKm > 0.02 ? Math.round(state.liveElapsedSec / state.liveDistKm) : 0;
      const mapPoints = state.liveRoute.length > 0 ? state.liveRoute : (state.liveMode === 'sim' ? course.route : []);

      return '' +
        '<div class="stack-md">' +
          '<div class="card flex flex-wrap items-center justify-between gap-4">' +
            '<div>' +
              '<h1 class="text-xl bold" style="margin:0;">라이브 GPS 러닝 트래커</h1>' +
              '<p class="text-xs muted" style="margin:4px 0 0;">실제 GPS 위치 추적 또는 8개 추천 코스 시뮬레이션으로 거리, 시간, 페이스 및 경로를 실시간 기록합니다.</p>' +
            '</div>' +
            '<div class="seg-group">' +
              '<button type="button" class="seg-btn ' + (state.liveMode === 'gps' ? 'active' : '') + '" data-action="live-mode" data-mode="gps" ' + (state.liveStatus === 'running' ? 'disabled' : '') + '>' + svgIcon('nav', 13) + '실시간 GPS 추적</button>' +
              '<button type="button" class="seg-btn ' + (state.liveMode === 'sim' ? 'active' : '') + '" data-action="live-mode" data-mode="sim" ' + (state.liveStatus === 'running' ? 'disabled' : '') + '>코스 시뮬레이션 (데모)</button>' +
            '</div>' +
          '</div>' +

          (state.liveGpsNotice ? '<div style="background:#0F172A;color:#F1F5F9;padding:12px 16px;border-radius:12px;font-size:12px;">' + esc(state.liveGpsNotice) + '</div>' : '') +

          '<div class="grid-12 items-stretch">' +
            '<div class="lg-span-5 card flex flex-col justify-between gap-4">' +
              '<div style="text-align:center;padding:12px 0;border-bottom:1px solid #F1F5F9;">' +
                '<div class="text-xs muted">경과 시간</div>' +
                '<div id="live-elapsed" class="font-mono-tab bold" style="font-size:48px;letter-spacing:-0.03em;margin-top:4px;">' + formatDuration(state.liveElapsedSec) + '</div>' +
              '</div>' +

              '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;">' +
                '<div class="sub-box"><div class="text-xs muted">거리</div><div id="live-dist" class="font-mono-tab text-lg bold" style="margin-top:4px;">' + state.liveDistKm.toFixed(2) + '<span class="text-xs muted" style="font-weight:400;"> km</span></div></div>' +
                '<div class="sub-box"><div class="text-xs muted">현재 페이스</div><div id="live-pace" class="font-mono-tab text-lg bold accent" style="margin-top:4px;">' + formatPace(state.liveCurrentPaceSec) + '</div></div>' +
                '<div class="sub-box"><div class="text-xs muted">평균 페이스</div><div id="live-avg-pace" class="font-mono-tab text-lg bold" style="margin-top:4px;">' + formatPace(avgPace) + '</div></div>' +
              '</div>' +

              (state.liveMode === 'sim' ? (
                '<div class="sub-box stack-sm text-xs">' +
                  '<div class="flex items-center justify-between gap-2"><span class="semi">시뮬레이션 코스</span><select id="sim-course-select" class="select" style="max-width:210px;padding:5px 8px;" ' + (state.liveStatus === 'running' ? 'disabled' : '') + '>' +
                    COURSE_PRESETS.map((c) => '<option value="' + c.id + '"' + (c.id === state.liveCourseId ? ' selected' : '') + '>' + esc(c.name) + ' (' + c.distanceKm + 'km)</option>').join('') +
                  '</select></div>' +
                  '<div><div class="flex justify-between"><span class="semi">목표 주행 페이스</span><span id="sim-pace-lbl" class="font-mono-tab bold accent">' + formatPace(state.simTargetPaceSec) + '/km</span></div>' +
                    '<input id="sim-pace-range" type="range" min="210" max="450" step="5" value="' + state.simTargetPaceSec + '" style="width:100%;accent-color:#EA580C;margin-top:4px;" /></div>' +
                  '<div class="flex items-center justify-between"><span class="semi">시뮬레이션 배속</span><div class="flex gap-1">' +
                    [1, 5, 20].map((m) => '<button type="button" class="' + (state.simSpeedMult === m ? 'btn-primary btn-sm' : 'btn-soft btn-sm') + ' font-mono-tab" data-action="sim-speed" data-mult="' + m + '">' + m + '×</button>').join('') +
                  '</div></div>' +
                '</div>'
              ) : '') +

              '<div class="grid-2">' +
                '<input id="live-title" class="input" value="' + esc(state.liveTitle) + '" placeholder="활동 제목 (선택)" />' +
                '<select id="live-type" class="select">' + Object.keys(WORKOUT_TYPE_LABELS).map((t) => '<option value="' + t + '"' + (t === state.liveWorkoutType ? ' selected' : '') + '>' + WORKOUT_TYPE_LABELS[t] + '</option>').join('') + '</select>' +
              '</div>' +

              '<div class="stack-sm">' +
                '<div class="flex items-center justify-between gap-2 text-xs muted"><span>착용 러닝화</span><select id="live-shoe" class="select" style="width:auto;max-width:220px;padding:6px 10px;"><option value="">선택 안 함</option>' +
                  activeShoes.map((s) => '<option value="' + s.id + '"' + (s.id === state.liveShoeId ? ' selected' : '') + '>' + esc(s.brand + ' ' + s.model) + '</option>').join('') +
                  '<option value="__custom__"' + (state.liveShoeId === '__custom__' ? ' selected' : '') + '>직접 입력</option>' +
                '</select></div>' +
                '<input id="live-shoe-custom" class="input" value="' + esc(state.liveShoeCustom || '') + '" maxlength="120" placeholder="착용 러닝화 직접 입력 (예: 나이키 페가수스 41)" />' +
              '</div>' +

              '<div class="flex flex-wrap items-center gap-2">' +
                (state.liveStatus !== 'running'
                  ? '<button type="button" class="btn-accent flex-1" style="min-height:44px;" data-action="live-start">' + svgIcon('play', 14) + (state.liveStatus === 'paused' ? '계속 달리기' : '러닝 시작') + '</button>'
                  : '<button type="button" class="btn-primary flex-1" style="min-height:44px;" data-action="live-pause">' + svgIcon('pause', 14) + '일시정지</button>') +
                '<button type="button" class="btn-soft" style="min-height:44px;" data-action="live-lap" ' + (state.liveStatus === 'idle' ? 'disabled' : '') + '>' + svgIcon('flag', 14) + '랩 기록</button>' +
                (state.liveElapsedSec >= 5 ? '<button type="button" class="btn-primary" style="min-height:44px;background:#16A34A;" data-action="live-save">' + svgIcon('save', 14) + '저장</button>' : '') +
                (state.liveStatus !== 'idle' ? '<button type="button" class="btn-soft" style="min-height:44px;" data-action="live-reset" aria-label="초기화">' + svgIcon('reset', 14) + '</button>' : '') +
              '</div>' +
            '</div>' +

            '<div class="lg-span-7 flex flex-col gap-4">' +
              '<div class="card-tight stack-sm flex-1">' +
                '<div class="flex items-center justify-between text-xs muted"><span class="semi" style="color:#0F172A;">실시간 경로 지도 · ' + (state.liveMode === 'gps' ? 'GPS 수신 모드' : esc(course.name)) + '</span><span class="font-mono-tab">좌표 ' + state.liveRoute.length + '개 기록됨</span></div>' +
                '<div id="live-map-host">' + renderRouteMap('live-map', mapPoints, 310, true, state.liveStatus === 'running') + '</div>' +
              '</div>' +
              '<div class="card-tight">' +
                '<div class="flex items-center justify-between" style="margin-bottom:8px;"><h2 class="text-sm bold" style="margin:0;">실시간 랩 · 구간 스플릿</h2><span class="text-xs muted font-mono-tab">' + state.liveLaps.length + ' Laps</span></div>' +
                (state.liveLaps.length === 0
                  ? '<p class="text-xs muted" style="margin:6px 0;">1km를 돌파하거나 "랩 기록" 버튼을 누르면 구간 페이스가 실시간으로 누적됩니다.</p>'
                  : '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;">' + state.liveLaps.map((l) =>
                      '<div class="sub-box"><div class="font-mono-tab muted" style="font-size:11px;">Lap ' + l.km + ' (' + l.distanceKm + 'km)</div><div class="font-mono-tab text-sm bold" style="margin-top:2px;">' + formatPace(l.paceSecPerKm) + '/km</div></div>'
                    ).join('') + '</div>') +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function renderTrainingPlan() {
      const plan = state.plan;
      const activeWeek = plan.weeks.find((w) => w.weekNumber === state.planWeekNum) || plan.weeks[0];
      const guide = LEVEL_GUIDELINES[plan.config.level];
      const doneCnt = activeWeek.sessions.filter((s) => s.workoutType !== 'rest' && plan.completedSessions[activeWeek.weekNumber + '-' + s.dayIndex]).length;
      const totalCnt = activeWeek.sessions.filter((s) => s.workoutType !== 'rest').length;

      const weekTabs = plan.weeks.map((w) =>
        '<button type="button" class="' + (state.planWeekNum === w.weekNumber ? 'btn-primary btn-sm' : 'btn-soft btn-sm') + '" data-action="plan-week" data-week="' + w.weekNumber + '">' + w.weekNumber + '주차 (' + w.totalKm + 'km)</button>'
      ).join('');

      const rows = activeWeek.sessions.map((s) => {
        const done = Boolean(plan.completedSessions[activeWeek.weekNumber + '-' + s.dayIndex]);
        const isRest = s.workoutType === 'rest';
        const isRun = !isRest && s.workoutType !== 'strength';
        const typeLbl = isRest ? '휴식' : s.workoutType === 'strength' ? '보강 운동' : WORKOUT_TYPE_LABELS[s.workoutType];
        return '' +
          '<div class="flex flex-wrap items-center justify-between gap-4" style="padding:14px 16px;background:' + (done ? '#ECFDF5' : '#FFFFFF') + ';">' +
            '<div class="flex items-start gap-3 flex-1">' +
              '<button type="button" ' + (isRest ? 'disabled' : '') + ' data-action="toggle-session" data-week="' + activeWeek.weekNumber + '" data-day="' + s.dayIndex + '" style="margin-top:2px;color:' + (isRest ? '#CBD5E1' : done ? '#16A34A' : '#94A3B8') + ';" aria-label="완료 체크">' +
                svgIcon(done ? 'checkCircle' : 'circle', 20) +
              '</button>' +
              '<div class="flex-1">' +
                '<div class="flex flex-wrap items-center gap-2 text-xs muted">' +
                  '<span class="bold" style="color:#1E293B;">' + s.dayLabel + '</span><span>·</span>' +
                  '<span class="semi accent">' + typeLbl + '</span><span>·</span>' +
                  '<span class="font-mono-tab">' + s.targetHrZone + '</span><span>·</span>' +
                  '<span class="font-mono-tab">' + s.rpeRange + '</span>' +
                '</div>' +
                '<div class="semi text-sm" style="margin-top:4px;' + (done ? 'text-decoration:line-through;color:#94A3B8;' : '') + '">' + esc(s.title) + '</div>' +
                '<div class="text-xs muted" style="margin-top:3px;">' + esc(s.description) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-4 shrink-0">' +
              '<div class="text-right">' +
                '<div class="font-mono-tab text-sm bold">' + (s.targetDistanceKm > 0 ? s.targetDistanceKm + ' km' : '—') + '</div>' +
                '<div class="font-mono-tab text-xs muted">' + esc(s.targetPaceRange) + '</div>' +
              '</div>' +
              (isRun ? '<button type="button" class="btn-soft btn-sm" data-action="quick-log-session" data-title="' + esc(s.title) + '" data-type="' + s.workoutType + '" data-dist="' + s.targetDistanceKm + '">' + svgIcon('plus', 13) + '기록하기</button>' : '') +
            '</div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="stack-lg">' +
          '<section class="card stack-md">' +
            '<div class="flex flex-wrap items-start justify-between gap-3">' +
              '<div><h1 class="text-xl bold" style="margin:0;">개인 맞춤형 러닝 훈련 계획 생성</h1><p class="text-xs muted" style="margin:4px 0 0;">목표 레이스와 현재 체력 수준(초급·중급·상급)을 입력하면 8주 주간 스케줄과 맞춤 강도 존을 자동 설계합니다.</p></div>' +
              '<div class="text-xs muted font-mono-tab">활성 플랜: <strong style="color:#0F172A;">' + esc(plan.title) + '</strong></div>' +
            '</div>' +
            '<form id="plan-form" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:end;">' +
              '<div><label class="label">운동 목표</label><select id="plan-goal" class="select">' +
                Object.keys(GOAL_LABELS).map((g) => '<option value="' + g + '"' + (g === plan.config.goal ? ' selected' : '') + '>' + GOAL_LABELS[g] + '</option>').join('') +
              '</select></div>' +
              '<div><label class="label">현재 체력 수준</label><select id="plan-level" class="select">' +
                '<option value="beginner"' + (plan.config.level === 'beginner' ? ' selected' : '') + '>초보자 (주 0~15km 입문)</option>' +
                '<option value="intermediate"' + (plan.config.level === 'intermediate' ? ' selected' : '') + '>중급자 (10K 완주 · 주 20~40km)</option>' +
                '<option value="advanced"' + (plan.config.level === 'advanced' ? ' selected' : '') + '>상급자 (서브4/서브3 · 주 45km+)</option>' +
              '</select></div>' +
              '<div><label class="label">주간 훈련 일수</label><select id="plan-days" class="select">' +
                [3, 4, 5, 6].map((d) => '<option value="' + d + '"' + (d === plan.config.daysPerWeek ? ' selected' : '') + '>주 ' + d + '일 훈련</option>').join('') +
              '</select></div>' +
              '<div><label class="label">현재 5K 기준 기록: <span id="plan-5k-val" class="font-mono-tab accent">' + plan.config.benchmark5kMinutes + '분</span></label>' +
                '<input id="plan-5k" type="range" min="17" max="42" step="1" value="' + plan.config.benchmark5kMinutes + '" style="width:100%;accent-color:#EA580C;padding:8px 0;" /></div>' +
              '<button type="submit" class="btn-accent" style="min-height:40px;">맞춤 계획 생성</button>' +
            '</form>' +
          '</section>' +

          '<section class="card stack-md">' +
            '<div class="flex flex-wrap items-center justify-between gap-4" style="padding-bottom:14px;border-bottom:1px solid #E2E8F0;">' +
              '<div><div class="text-xs muted">' + esc(plan.summary) + '</div><h2 class="text-lg bold" style="margin:2px 0;">' + activeWeek.weekNumber + '주차 · ' + activeWeek.phaseName + '</h2><p class="text-xs muted" style="margin:0;">' + esc(activeWeek.focusSummary) + '</p></div>' +
              '<div class="flex items-center gap-4 text-xs">' +
                '<div><div class="muted">주간 목표 거리</div><div class="font-mono-tab text-base bold">' + activeWeek.totalKm + ' km</div></div>' +
                '<span style="color:#E2E8F0;">|</span>' +
                '<div><div class="muted">완료율</div><div class="font-mono-tab text-base bold accent">' + doneCnt + ' / ' + totalCnt + ' 세션</div></div>' +
              '</div>' +
            '</div>' +
            '<div class="flex flex-wrap gap-2">' + weekTabs + '</div>' +
            '<div class="table-wrap divider-y">' + rows + '</div>' +
          '</section>' +

          '<section class="grid-12">' +
            '<div class="lg-span-7 card stack-sm">' +
              '<div><h2 class="text-base bold" style="margin:0;">개인 맞춤 5단계 운동 강도 존 (Training Zones)</h2><p class="text-xs muted" style="margin:2px 0 0;">입력하신 5K 기록(' + plan.config.benchmark5kMinutes + '분) 기준으로 산출된 목표 페이스 및 주관적 운동 강도(RPE)입니다.</p></div>' +
              '<div class="table-wrap"><table class="data-table"><thead><tr><th>강도 존</th><th>목표 페이스</th><th>심박 / RPE</th><th>호흡 · 대화 기준</th></tr></thead><tbody>' +
                plan.zones.map((z) => '<tr><td><div class="bold">' + z.zone + '</div><div class="text-xs muted">' + z.name + '</div></td><td class="font-mono-tab semi accent">' + z.paceRange + '</td><td class="font-mono-tab"><div>' + z.hrPercent + '</div><div class="text-xs muted">' + z.rpe + '</div></td><td class="text-xs muted">' + z.talkTest + '</td></tr>').join('') +
              '</tbody></table></div>' +
            '</div>' +
            '<div class="lg-span-5 card stack-sm">' +
              '<div><div class="text-xs semi accent">' + LEVEL_LABELS[plan.config.level] + ' 맞춤형 가이드</div><h2 class="text-base bold" style="margin:4px 0 0;">' + guide.headline + '</h2></div>' +

    function renderAnalytics() {
      const buckets = state.periodMode === 'weekly' ? computeWeeklyBuckets(state.runs, REFERENCE_DATE, 8) : computeMonthlyBuckets(state.runs, REFERENCE_DATE, 6);
      const maxKm = Math.max(15, ...buckets.map((b) => b.distanceKm));
      const activeIdx = (state.selectedBucketIdx !== null && buckets[state.selectedBucketIdx]) ? state.selectedBucketIdx : buckets.length - 1;
      const activeBucket = buckets[activeIdx];

      const totalKm = state.runs.reduce((a, r) => a + r.distanceKm, 0);
      const distRows = Object.keys(WORKOUT_TYPE_LABELS).map((t) => {
        const sub = state.runs.filter((r) => r.workoutType === t);
        const km = sub.reduce((a, r) => a + r.distanceKm, 0);
        const pct = totalKm > 0 ? Math.round((km / totalKm) * 100) : 0;
        return '' +
          '<div class="stack-sm" style="gap:6px;">' +
            '<div class="flex justify-between text-xs"><span class="semi">' + WORKOUT_TYPE_LABELS[t] + ' <span class="muted">(' + sub.length + '회)</span></span><span class="font-mono-tab">' + km.toFixed(1) + ' km · ' + pct + '%</span></div>' +
            '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;background:' + WORKOUT_TYPE_COLORS[t] + ';"></div></div>' +
          '</div>';
      }).join('');

      const q = state.logSearch.trim().toLowerCase();
      const filteredRuns = state.runs.filter((r) => {
        const okType = state.logFilterType === 'all' || r.workoutType === state.logFilterType;
        const okQ = !q || r.title.toLowerCase().includes(q) || (r.courseName && r.courseName.toLowerCase().includes(q)) || (r.notes && r.notes.toLowerCase().includes(q));
        return okType && okQ;
      });

      const filteredCourses = state.courseDifficulty === '전체' ? COURSE_PRESETS : COURSE_PRESETS.filter((c) => c.difficulty === state.courseDifficulty);

      const cDist = Math.max(0.5, parseFloat(state.calcDistKm) || 10);
      const cTotalSec = Math.max(60, (parseInt(state.calcMin || '0', 10) || 0) * 60 + (parseInt(state.calcSec || '0', 10) || 0));
      const cPace = Math.round(cTotalSec / cDist);
      const cKmh = (cDist / (cTotalSec / 3600)).toFixed(1);

      return '' +
        '<div class="stack-lg">' +
          '<section class="grid-12">' +
            '<div class="lg-span-8 card stack-md">' +
              '<div class="flex flex-wrap items-center justify-between gap-3">' +
                '<div><h1 class="text-xl bold" style="margin:0;">주간 · 월간 러닝 통계 분석</h1><p class="text-xs muted" style="margin:4px 0 0;">기간별 누적 거리, 러닝 횟수, 평균 페이스 및 상승 고도 추이를 비교합니다.</p></div>' +
                '<div class="seg-group">' +
                  '<button type="button" class="seg-btn ' + (state.periodMode === 'weekly' ? 'active' : '') + '" data-action="period-mode" data-mode="weekly">주간 통계 (8주)</button>' +
                  '<button type="button" class="seg-btn ' + (state.periodMode === 'monthly' ? 'active' : '') + '" data-action="period-mode" data-mode="monthly">월간 통계 (6개월)</button>' +
                '</div>' +
              '</div>' +

              '<div style="display:grid;grid-template-columns:repeat(' + buckets.length + ',1fr);gap:10px;height:165px;padding-bottom:12px;border-bottom:1px solid #F1F5F9;">' +
                buckets.map((b, i) => {
                  const hp = b.distanceKm > 0 ? Math.max(12, (b.distanceKm / maxKm) * 100) : 5;
                  const sel = i === activeIdx;
                  const col = b.distanceKm === 0 ? '#F1F5F9' : sel ? '#EA580C' : '#1E293B';
                  return '<button type="button" data-action="select-bucket" data-idx="' + i + '" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;">' +
                    '<span class="font-mono-tab muted" style="font-size:11px;">' + (b.distanceKm > 0 ? b.distanceKm : 0) + '</span>' +
                    '<div style="width:100%;max-width:44px;flex:1;display:flex;align-items:end;"><div style="width:100%;height:' + hp + '%;background:' + col + ';border-radius:6px 6px 0 0;"></div></div>' +
                    '<span class="font-mono-tab text-xs ' + (sel ? 'bold accent' : 'muted') + '">' + b.label + '</span>' +
                  '</button>';
                }).join('') +
              '</div>' +

              (activeBucket ? (
                '<div class="grid-kpi">' +
                  '<div><div class="text-xs muted">선택 기간 (' + activeBucket.label + ')</div><div class="font-mono-tab text-base bold" style="margin-top:2px;">' + activeBucket.distanceKm.toFixed(1) + ' km</div></div>' +
                  '<div><div class="text-xs muted">러닝 횟수</div><div class="font-mono-tab text-base bold" style="margin-top:2px;">' + activeBucket.runCount + '회</div></div>' +
                  '<div><div class="text-xs muted">평균 페이스</div><div class="font-mono-tab text-base bold accent" style="margin-top:2px;">' + (activeBucket.avgPaceSec > 0 ? formatPace(activeBucket.avgPaceSec) + '/km' : '—') + '</div></div>' +
                  '<div><div class="text-xs muted">총 시간 · 상승 고도</div><div class="font-mono-tab text-base bold" style="margin-top:2px;">' + formatDurationKorean(activeBucket.durationSec) + ' · +' + activeBucket.elevationGainM + 'm</div></div>' +
                '</div>'
              ) : '') +
            '</div>' +

            '<div class="lg-span-4 card stack-md">' +
              '<h2 class="text-base bold" style="margin:0;">훈련 유형별 거리 비중</h2>' +
              '<div class="stack-sm">' + distRows + '</div>' +
            '</div>' +
          '</section>' +

          '<section class="card stack-md">' +
            '<div class="flex flex-wrap items-center justify-between gap-3">' +
              '<h2 class="text-base bold" style="margin:0;">전체 활동 일지 (클릭하여 경로 지도 · 스플릿 확인)</h2>' +
              '<div class="flex flex-wrap items-center gap-2">' +

                '<div class="seg-group">' +
                  '<button type="button" class="seg-btn ' + (state.logFilterType === 'all' ? 'active' : '') + '" data-action="log-filter" data-type="all">전체</button>' +
                  Object.keys(WORKOUT_TYPE_LABELS).map((t) => '<button type="button" class="seg-btn ' + (state.logFilterType === t ? 'active' : '') + '" data-action="log-filter" data-type="' + t + '">' + WORKOUT_TYPE_LABELS[t] + '</button>').join('') +

              '</div>' +
            '</div>' +

            (filteredRuns.length === 0
              ? '<div style="padding:36px 0;text-align:center;" class="stack-sm"><div class="text-sm muted">조건에 일치하는 러닝 기록이 없습니다.</div><button type="button" class="text-xs semi accent" data-action="log-reset">필터 초기화</button></div>'
              : '<div class="table-wrap"><table class="data-table"><thead><tr><th>날짜</th><th>활동명 · 코스</th><th>유형</th><th class="text-right">거리</th><th class="text-right">시간</th><th class="text-right">평균 페이스</th><th class="text-right">고도</th></tr></thead><tbody>' +
                filteredRuns.map((r) => {
                  const sLabel = getRunShoeLabel(r);
                  const subParts = [r.courseName, sLabel ? '러닝화: ' + sLabel : ''].filter(Boolean);
                  return '<tr class="clickable" data-action="open-run" data-id="' + esc(r.id) + '"><td class="font-mono-tab text-xs muted">' + esc(r.date) + '</td><td><div class="semi">' + esc(r.title) + '</div>' + (subParts.length ? '<div class="text-xs muted">' + esc(subParts.join(' · ')) + '</div>' : '') + '</td><td class="text-xs">' + WORKOUT_TYPE_LABELS[r.workoutType] + '</td><td class="text-right font-mono-tab semi">' + r.distanceKm.toFixed(2) + ' km</td><td class="text-right font-mono-tab">' + formatDuration(r.durationSec) + '</td><td class="text-right font-mono-tab semi accent">' + formatPace(r.avgPaceSecPerKm) + '/km</td><td class="text-right font-mono-tab muted">+' + r.elevationGainM + 'm</td></tr>';
                }).join('') +
              '</tbody></table></div>') +
          '</section>' +

          '<section class="grid-12">' +
            '<div class="lg-span-7 stack-md">' +
              '<div class="flex flex-wrap items-center justify-between gap-3">' +
                '<div><h2 class="text-base bold" style="margin:0;">추천 러닝 코스 (' + filteredCourses.length + '개)</h2><p class="text-xs muted" style="margin:2px 0 0;">경로 지도를 미리 확인하거나 라이브 시뮬레이터에서 바로 달려볼 수 있습니다.</p></div>' +
                '<div class="seg-group">' +
                  ['전체', '입문', '보통', '도전'].map((d) => '<button type="button" class="seg-btn ' + (state.courseDifficulty === d ? 'active' : '') + '" data-action="course-diff" data-diff="' + d + '">' + d + '</button>').join('') +
                '</div>' +
              '</div>' +
              '<div class="grid-2">' +
                filteredCourses.map((c) =>
                  '<div class="card-tight flex flex-col justify-between gap-3" style="padding:0;overflow:hidden;">' +
                    '<div>' +
                      '<div style="aspect-ratio:4/2.4;overflow:hidden;border-bottom:1px solid #F1F5F9;">' + renderCourseCardVisual(c) + '</div>' +
                      '<div style="padding:14px 16px;" class="stack-sm">' +
                        '<div style="font-size:11px;" class="muted">' + esc(c.region) + ' · ' + c.difficulty + ' · ' + esc(c.surface) + '</div>' +
                        '<div class="text-sm bold">' + esc(c.name) + '</div>' +
                        '<div class="text-xs font-mono-tab">' + c.distanceKm + ' km · +' + c.elevationGainM + ' m</div>' +
                        '<p class="text-xs muted" style="margin:0;line-height:1.5;">' + esc(c.description) + '</p>' +
                      '</div>' +
                    '</div>' +
                    '<div class="flex items-center gap-2" style="padding:0 16px 16px;">' +
                      '<button type="button" class="btn-soft btn-sm" data-action="preview-course" data-id="' + c.id + '">' + svgIcon('map', 13) + '경로 보기</button>' +
                      '<button type="button" class="btn-primary btn-sm flex-1" data-action="sim-course" data-id="' + c.id + '">' + svgIcon('play', 12) + '시뮬레이션 달리기</button>' +
                    '</div>' +
                  '</div>'
                ).join('') +
              '</div>' +
            '</div>' +

            '<div class="lg-span-5 card stack-md" style="align-self:start;">' +
              '<div><h2 class="text-base bold" style="margin:0;">페이스 · 레이스 완주 예측 계산기</h2><p class="text-xs muted" style="margin:2px 0 0;">기준 거리와 기록을 입력하면 요구 페이스 및 풀·하프 예상 기록을 계산합니다.</p></div>' +
              '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">' +
                '<div><label class="label">기준 거리 (km)</label><input id="calc-dist" type="number" step="0.1" min="1" value="' + esc(state.calcDistKm) + '" class="input font-mono-tab" /></div>' +
                '<div><label class="label">분</label><input id="calc-min" type="number" min="1" value="' + esc(state.calcMin) + '" class="input font-mono-tab" /></div>' +
                '<div><label class="label">초</label><input id="calc-sec" type="number" min="0" max="59" value="' + esc(state.calcSec) + '" class="input font-mono-tab" /></div>' +
              '</div>' +
              '<div class="sub-box flex items-center justify-between">' +
                '<div><div class="text-xs muted">요구 평균 페이스</div><div id="calc-pace-out" class="font-mono-tab text-xl bold accent">' + formatPace(cPace) + '/km</div></div>' +
                '<div class="text-right"><div class="text-xs muted">평균 시속</div><div id="calc-kmh-out" class="font-mono-tab text-lg bold">' + cKmh + ' km/h</div></div>' +
              '</div>' +
              '<div class="stack-sm">' +
                '<div class="text-xs semi">예상 레이스 완주 기록 (Riegel 공식)</div>' +
                '<div id="calc-preds" class="grid-2" style="gap:10px;">' +
                  '<div class="sub-box flex justify-between text-xs"><span class="muted">5K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(cDist, cTotalSec, 5)) + '</span></div>' +
                  '<div class="sub-box flex justify-between text-xs"><span class="muted">10K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(cDist, cTotalSec, 10)) + '</span></div>' +
                  '<div class="sub-box flex justify-between text-xs"><span class="muted">하프 21.1K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(cDist, cTotalSec, 21.0975)) + '</span></div>' +
                  '<div class="sub-box flex justify-between text-xs"><span class="muted">풀코스 42.2K</span><span class="font-mono-tab bold">' + formatDuration(predictRaceTimeRiegel(cDist, cTotalSec, 42.195)) + '</span></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</section>' +
        '</div>';
    }

    // Live Tracking Engine (Simulator + Real Browser Geolocation)
    let simInterval = null, gpsWatchId = null, lastKmMark = 0, lastLapTime = 0;

    function stopLiveWatchers() {
      if (simInterval) { clearInterval(simInterval); simInterval = null; }
      if (gpsWatchId !== null && navigator.geolocation) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
    }

    function startLiveLoop() {
      stopLiveWatchers();
      if (state.liveMode === 'sim') {
        const course = COURSE_PRESETS.find((c) => c.id === state.liveCourseId) || COURSE_PRESETS[0];
        simInterval = setInterval(() => {
          state.liveElapsedSec += state.simSpeedMult;
          const activePace = Math.max(190, Math.round(state.simTargetPaceSec + Math.sin(Date.now() / 1800) * 8));
          state.liveCurrentPaceSec = activePace;
          state.liveDistKm += state.simSpeedMult / activePace;
          const pts = course.route;
          if (pts.length >= 2) {
            const frac = (state.liveDistKm / course.distanceKm) % 1;
            const exact = frac * (pts.length - 1);
            const idx = Math.min(pts.length - 2, Math.floor(exact));
            const t = exact - idx;
            const a = pts[idx], b = pts[idx + 1];
            const newPt = {
              lat: a.lat + (b.lat - a.lat) * t,
              lng: a.lng + (b.lng - a.lng) * t,
              ele: a.ele + (b.ele - a.ele) * t,
              paceSecPerKm: activePace,
              timestamp: Date.now()
            };
            if (state.liveRoute.length === 0) state.liveRoute = [{ ...pts[0], paceSecPerKm: activePace }, newPt];
            else {
              const last = state.liveRoute[state.liveRoute.length - 1];
              if (haversineDistanceKm(last, newPt) > 0.03 || state.liveRoute.length < 2) {
                state.liveRoute = [...state.liveRoute.slice(-180), newPt];
              }
            }
          }
          const completed = Math.floor(state.liveDistKm);
          if (completed > lastKmMark) {
            lastKmMark = completed;
            const dur = Math.max(120, state.liveElapsedSec - lastLapTime);
            lastLapTime = state.liveElapsedSec;
            state.liveLaps.push({ km: completed, distanceKm: 1, durationSec: dur, paceSecPerKm: dur, elevationDiff: Math.round(course.elevationGainM / course.distanceKm) });
          }
          if (state.activeTab === 'live') render();
        }, 1000);
      } else {
        simInterval = setInterval(() => {
          state.liveElapsedSec += 1;
          const el = document.getElementById('live-elapsed');
          if (el) el.textContent = formatDuration(state.liveElapsedSec);
        }, 1000);
        if (!('geolocation' in navigator)) {
          state.liveGpsNotice = '이 브라우저는 GPS 위치 API를 지원하지 않습니다. 코스 시뮬레이션 모드를 이용해 주세요.';
          render();
          return;
        }
        state.liveGpsNotice = '실시간 GPS 신호를 수신하고 있습니다. 실외 이동 시 거리와 경로가 자동 측정됩니다.';
        gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const pt = { lat: pos.coords.latitude, lng: pos.coords.longitude, ele: pos.coords.altitude ?? 15, timestamp: pos.timestamp };
            if (state.liveRoute.length === 0) {
              state.liveRoute.push({ ...pt, paceSecPerKm: 330 });
            } else {
              const last = state.liveRoute[state.liveRoute.length - 1];
              const dKm = haversineDistanceKm(last, pt);
              if (dKm >= 0.005) {
                const dSec = Math.max(1, ((pt.timestamp || Date.now()) - (last.timestamp || Date.now())) / 1000);
                const inst = Math.min(1200, Math.max(150, Math.round(dSec / dKm)));
                state.liveCurrentPaceSec = inst;
                state.liveDistKm += dKm;
                state.liveRoute.push({ ...pt, paceSecPerKm: inst });
              }
            }
            if (state.activeTab === 'live') render();
          },
          (err) => {
            state.liveGpsNotice = err.code === 1
              ? '위치 권한이 거부되었습니다. 브라우저 설정에서 허용하거나 코스 시뮬레이션 모드를 사용해 보세요.'
              : '실내 환경에서는 GPS 신호가 약할 수 있습니다. 코스 시뮬레이션 모드로 바로 테스트할 수 있습니다.';
            if (state.activeTab === 'live') render();
          },
          { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
        );
      }
    }

    function resetLiveRun() {
      stopLiveWatchers();
      state.liveStatus = 'idle';
      state.liveElapsedSec = 0;
      state.liveDistKm = 0;
      state.liveCurrentPaceSec = 0;
      state.liveRoute = [];
      state.liveLaps = [];
      state.liveGpsNotice = '';
      lastKmMark = 0;
      lastLapTime = 0;
    }

    // Core Data Mutations + Optional Firestore Sync
    async function saveNewRun(run) {
      state.runs = [run, ...state.runs].sort((a, b) => (a.date < b.date ? 1 : -1));
      if (run.shoeId) {
        state.shoes = state.shoes.map((s) => s.id === run.shoeId ? { ...s, distanceKm: Number((s.distanceKm + run.distanceKm).toFixed(1)) } : s);
      }
      saveLocalState();
      if (state.user && state.fb) {
        try {
          const { doc, setDoc, serverTimestamp } = state.fb.fs;
          await setDoc(doc(state.fb.db, 'users', state.user.uid, 'runs', run.id), {
            userId: state.user.uid, title: run.title.slice(0, 120), date: run.date, startTime: run.startTime,
            workoutType: run.workoutType, distanceKm: run.distanceKm, durationSec: run.durationSec,
            avgPaceSecPerKm: run.avgPaceSecPerKm, elevationGainM: run.elevationGainM,
            ...(run.shoeId ? { shoeId: run.shoeId } : {}), ...(run.shoeName ? { shoeName: run.shoeName.slice(0, 120) } : {}), ...(run.courseName ? { courseName: run.courseName } : {}),
            ...(run.notes ? { notes: run.notes.slice(0, 500) } : {}),
            route: run.route.slice(0, 180), splits: run.splits.slice(0, 90),
            createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
        } catch (err) { handleFsError(err, 'create', 'users/' + state.user.uid + '/runs/' + run.id); }
      }
      showToast('"' + run.title + '" (' + run.distanceKm.toFixed(1) + 'km) 기록이 저장되었습니다.');
    }

    async function shareRunToFeed(run, caption) {
      const postId = 'post-' + Date.now();
      const post = {
        id: postId, authorId: state.user ? state.user.uid : 'me-local',
        authorName: state.user ? (state.user.displayName || '러너') : '나 (로컬 러너)',
        title: run.title.slice(0, 120), caption: caption.slice(0, 500),
        workoutType: run.workoutType, distanceKm: run.distanceKm, durationSec: run.durationSec,
        avgPaceSecPerKm: run.avgPaceSecPerKm, elevationGainM: run.elevationGainM,
        courseName: run.courseName, route: run.route.slice(0, 100),
        cheersCount: 0, commentsCount: 0, createdAtLabel: '방금 전', cheeredByMe: false, comments: []
      };
      state.posts = [post, ...state.posts];
      state.expandedPostId = postId;
      saveLocalState();
      if (state.user && state.fb) {
        try {
          const { doc, setDoc, serverTimestamp } = state.fb.fs;
          await setDoc(doc(state.fb.db, 'communityPosts', postId), {

            title: post.title, caption: post.caption, workoutType: post.workoutType,
            distanceKm: post.distanceKm, durationSec: post.durationSec, avgPaceSecPerKm: post.avgPaceSecPerKm,
            elevationGainM: post.elevationGainM, ...(post.courseName ? { courseName: post.courseName } : {}),
            route: post.route, cheersCount: 0, commentsCount: 0, isPublic: true,
            createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
        } catch (err) { handleFsError(err, 'create', 'communityPosts/' + postId); }
      }

      render();

    function computeChallengeMetric(cat, startDate, endDate) {
      const m = state.runs.filter((r) => r.date >= startDate && r.date <= endDate);
      if (cat === 'distance') return Number(m.reduce((a, r) => a + r.distanceKm, 0).toFixed(1));
      if (cat === 'runs') return m.length;
      return m.reduce((a, r) => a + r.elevationGainM, 0);
    }

    function handleFsError(err, op, path) {
      console.error('Firestore Error:', JSON.stringify({ error: err && err.message ? err.message : String(err), op, path }));
    }

    // Dynamic Firebase Initialization via CDN (skipped gracefully on file://)
    async function initFirebaseCdn() {
      if (window.location.protocol === 'file:') return;
      try {
        const [appMod, authMod, fsMod] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),
          import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')
        ]);
        const app = appMod.initializeApp(FIREBASE_CONFIG);
        const db = fsMod.getFirestore(app, FIREBASE_CONFIG.firestoreDatabaseId);
        const auth = authMod.getAuth(app);
        const provider = new authMod.GoogleAuthProvider();
        state.fb = { app, db, auth, provider, authMod, fs: fsMod };

        // Connection test
        try { await fsMod.getDocFromServer(fsMod.doc(db, 'test', 'connection')); } catch (e) {}

        authMod.onAuthStateChanged(auth, async (u) => {
          state.user = u;
          if (u) {
            try {
              const uRef = fsMod.doc(db, 'users', u.uid);
              const snap = await fsMod.getDoc(uRef);
              if (!snap.exists()) {
                await fsMod.setDoc(uRef, {
                  uid: u.uid, displayName: (u.displayName || '러너').slice(0, 60),
                  photoURL: (u.photoURL || '').slice(0, 500), fitnessLevel: state.plan.config.level,
                  weeklyGoalKm: state.weeklyGoalKm, createdAt: fsMod.serverTimestamp(), updatedAt: fsMod.serverTimestamp()
                });
              }
              if (u.email) {
                await fsMod.setDoc(fsMod.doc(db, 'users', u.uid, 'private', 'info'), {
                  uid: u.uid, email: u.email.slice(0, 254), updatedAt: fsMod.serverTimestamp()
                }, { merge: true });
              }
            } catch (e) {}

            // Sync runs from Firestore
            const rq = fsMod.query(fsMod.collection(db, 'users/' + u.uid + '/runs'), fsMod.orderBy('date', 'desc'), fsMod.limit(50));
            fsMod.onSnapshot(rq, (snap) => {
              if (snap.empty) return;
              const cloud = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              const ids = new Set(cloud.map((r) => r.id));
              state.runs = [...cloud, ...state.runs.filter((r) => !ids.has(r.id))].sort((a, b) => (a.date < b.date ? 1 : -1));
              saveLocalState();
              render();
            }, (err) => handleFsError(err, 'list', 'users/' + u.uid + '/runs'));
          }
          renderNavAndFooter();
          if (state.activeTab === 'community') render();
        });
      } catch (e) {
        // Offline or blocked CDN: local mode keeps working seamlessly
      }
    }

      else if (act === 'open-export-modal') { state.showExportModal = true; renderModals(); }
      else if (act === 'close-modal') { state.selectedRunId = null; state.previewCourseId = null; state.showAddRunModal = false; state.showExportModal = false; renderModals(); }
